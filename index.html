<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#7454c7"
    >

    <title>Sparkle Routine ✦</title>


    <!-- ICONO DE LA PESTAÑA -->

    <link
        rel="icon"
        type="image/jpeg"
        href="images/ts.jpg"
    >


    <!-- CSS -->

    <link
        rel="stylesheet"
        href="style.css"
    >


    <!-- PWA -->

    <link
        rel="manifest"
        href="manifest.json"
    >

</head>


<body>


    <!-- =========================
         TWILIGHT FLOTANTE
    ========================== -->

    <img
        src="images/png.gif"
        class="twilight-floating"
        alt="Twilight Sparkle"
    >



    <main class="app">


        <!-- =========================
             PORTADA
        ========================== -->

        <header>

            <div class="header-text">

                <p class="subtitle">
                    ✦ MI SEMANA ✦
                </p>


                <h1>
                    Sparkle Routine
                </h1>


                <p class="message">
                    Organiza tu semana,
                    una estrella a la vez.
                </p>

            </div>



            <div class="header-character">

                <img
                    src="images/ts.jpg"
                    alt="Twilight Sparkle"
                    class="twilight-header sparkle-image"
                >

            </div>

        </header>



        <!-- =========================
             PROGRESO
        ========================== -->

        <section class="progress-section">

            <div class="progress-text">

                <span>
                    Progreso semanal
                </span>


                <strong id="progress-number">
                    0 / 4
                </strong>

            </div>


            <div class="progress-bar">

                <div id="progress"></div>

            </div>


            <p id="progress-message">
                Tu aventura comienza aquí ✨
            </p>

        </section>



        <!-- =========================
             ENTRENAMIENTOS
        ========================== -->

        <section
            id="workout-container"
            class="workouts"
        >
        </section>



        <!-- =========================
             ESTADÍSTICAS
        ========================== -->

        <section class="stats">

            <div class="stat-card">

                <span class="stat-icon">
                    ✨
                </span>

                <strong id="stars">
                    0
                </strong>

                <p>
                    Estrellas
                </p>

            </div>


            <div class="stat-card">

                <span class="stat-icon">
                    🔥
                </span>

                <strong id="streak">
                    0
                </strong>

                <p>
                    Racha semanal
                </p>

            </div>

        </section>



        <!-- =========================
             TWILIGHT DEL FINAL
        ========================== -->

        <section class="twilight-footer">

            <img
                src="images/meme.jpg"
                alt="Twilight Sparkle"
                class="sparkle-image"
            >

            <p>
                ✦ Una estrella más para tu semana ✦
            </p>

        </section>



        <!-- =========================
             REINICIAR
        ========================== -->

        <button
            id="reset-week"
            class="reset-button"
        >
            Reiniciar semana
        </button>


    </main>



    <!-- JAVASCRIPT -->

    <script src="app.js"></script>

</body>

</html>
